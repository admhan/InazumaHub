<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>InazumaHub - Player</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="assets/css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
<header class="site-header">
  <div class="container header-inner">
    <h1><a href="index.html">InazumaHub</a></h1>
    <p class="subtitle">Player details</p>
  </div>
</header>

<main class="container" id="player-page">
  <a href="index.html" class="back-link">← Back to list</a>

  <section class="player-header">
    <div class="player-image-wrapper">
      <img id="player-image" src="" alt="Player image" onerror="this.style.display='none'">
    </div>
    <div class="player-meta">
      <h2 id="player-name"></h2>
      <p id="player-game"></p>
      <div class="info-grid">
        <div>
          <span class="info-label">Position</span>
          <span class="info-value" id="info-position"></span>
        </div>
        <div>
          <span class="info-label">Element</span>
          <span class="info-value" id="info-element"></span>
        </div>
        <div>
          <span class="info-label">Role</span>
          <span class="info-value" id="info-role"></span>
        </div>
        <div>
          <span class="info-label">Game</span>
          <span class="info-value" id="info-game"></span>
        </div>
        <div>
          <span class="info-label">Age</span>
          <span class="info-value" id="info-age"></span>
        </div>
        <div>
          <span class="info-label">School Year</span>
          <span class="info-value" id="info-school-year"></span>
        </div>
      </div>
    </div>
  </section>

  <section class="rarity-section">
    <label for="rarity-select">Rarity</label>
    <select id="rarity-select">
      <option value="Normal">Normal</option>
      <option value="Grimpant">Grimpant</option>
      <option value="Experimente">Expérimenté</option>
      <option value="Emerite">Émérite</option>
      <option value="Legendaire">Légendaire</option>
      <option value="Heroique">Héroïque</option>
    </select>
  </section>

  <section class="stats-section">
    <h3>Stats</h3>
    <div class="stats-grid">
      <table class="stats-table">
        <tbody>
        <tr><th>Kick</th><td id="stat-kick"></td></tr>
        <tr><th>Control</th><td id="stat-control"></td></tr>
        <tr><th>Technique</th><td id="stat-technique"></td></tr>
        <tr><th>Pressure</th><td id="stat-pressure"></td></tr>
        <tr><th>Physical</th><td id="stat-physical"></td></tr>
        <tr><th>Agility</th><td id="stat-agility"></td></tr>
        <tr><th>Intelligence</th><td id="stat-intelligence"></td></tr>
        </tbody>
      </table>
      <div class="radar-wrapper">
        <canvas id="stats-radar" width="320" height="320" aria-label="Player stats radar" role="img"></canvas>
      </div>
    </div>
  </section>

  <section class="text-section">
    <h3>Description</h3>
    <p id="player-description"></p>
  </section>

  <section class="text-section">
    <h3>How to obtain</h3>
    <p id="player-obtain"></p>
  </section>
</main>

<footer class="site-footer">
  <div class="container">
    <p>InazumaHub · Fan-made project</p>
  </div>
</footer>

<script src="assets/js/player.js"></script>
</body>
</html>
